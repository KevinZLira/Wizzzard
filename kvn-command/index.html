<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/palette.css" />
  </head>
  <body>
    <div id="kvn-root"></div>
    <!--
      UXP wraps files pulled in via require() as CommonJS modules (module,
      exports, require are only defined in that context) — it does NOT do
      that for plain <script src> tags. So only the entry point is loaded
      here; everything else is require()'d from inside app.js.
    -->
    <script src="js/app.js"></script>
  </body>
</html>
