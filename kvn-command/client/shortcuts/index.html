<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KVN Console - Atalhos</title>
    <link rel="stylesheet" href="../main/css/palette.css">
    <link rel="stylesheet" href="shortcuts.css">
  </head>
  <body class="kvn-shortcuts">
    <header>
      <div class="hub-category"><span class="kvn-prompt">&gt;</span> ATALHOS</div>
      <h1>KVN Console</h1>
      <p>Escolha uma ação e pressione a tecla que quer usar.<br>Uma tecla única, como <strong>'</strong>, ou uma combinação.</p>
    </header>
    <main class="list" id="bindings" aria-label="Atalhos do KVN Console"></main>
    <div class="status" id="status" role="status">Conectando…</div>
    <footer class="actions">
      <button id="open">Abrir KVN Console</button>
      <button id="done" class="primary">Concluir</button>
    </footer>
    <script src="../main/js/hotkey-bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
