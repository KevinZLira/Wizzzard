<!DOCTYPE html>

    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/palette.css" />

  <body>
    <div id="kvn-root"></div>
    <!--
      Plain <script> tags, in dependency order, each attaching to
      window.KVN.* instead of using require()/module.exports. CEP with
      Node integration would let us use require() here, but its relative-
      path resolution under a <script>-tagged (not require()'d) entry
      file wasn't something we could verify without a live host — same
      class of surprise that broke the earlier UXP build. A plain global
      namespace has no path resolution to get wrong.
    -->
    <script src="js/host-bridge.js"></script>
    <script src="js/search-engine.js"></script>
    <script src="js/store.js"></script>
    <script src="js/effects-metadata.js"></script>
    <script src="js/premiere-bridge.js"></script>
    <script src="js/effects-catalog.js"></script>
    <script src="js/app.js"></script>
  </body>
